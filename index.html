const banks = Object.fromEntries(eras.map(era=>[era.id,rows[era.id].map((r,i)=>{
 const dim=i%8, key=`${era.id}-${i}`, meta=special[key];
 const permutation=[[2,0,3,1],[1,3,0,2],[3,1,2,0],[0,2,1,3]][i%4];

 const preference=!!profiles||i===24;
 return {id:key,dim,ability:preference?'审美与价值取向':dimensions[dim].name,
   hint:preference?'你被怎样的意境、情感与人生姿态打动':dimensions[dim].hint,
   type:meta?.type||`虚构情境 · ${era.name}`,note:meta?.note||'借用时代生活背景创作；你可代入当时，不需要掌握历史知识。',
   source:meta?.url?{title:meta.type,url:meta.url}:sources[era.id],title:r[0],
   options:permutation.map(n=>({text:r[n+1],scores:profiles?profiles[n].map(v=>v*1.2):dimensions.map((_,d)=>d===dim?[-3,-1,1,3][n]:0)}))};
})]));
function publicQuestions(era){
 if(!banks[era])throw new Error('无效朝代');
 return banks[era].map(({options,...q})=>({...q,options:options.map(o=>({text:o.text}))}));
}

function candidates(era,gender='any'){
 if(!eras.some(e=>e.id===era)||!['male','female','any'].includes(gender))throw new Error('人物范围无效');
 return figures.filter(f=>f.era===era&&(gender==='any'||f.gender===gender));
}
function profileFor(era,answers){
 const qs=banks[era];
 if(!qs||!Array.isArray(answers)||answers.length!==26||Array.from(answers).some(a=>!Number.isInteger(a)||a<0||a>3))throw new Error('需要完成26道题');
 const totals=dimensions.map(()=>0),max=dimensions.map(()=>0);
 qs.forEach((q,i)=>q.options[answers[i]].scores.forEach((v,d)=>{totals[d]+=v;max[d]+=Math.max(...q.options.map(o=>Math.abs(o.scores[d])));}));
 return totals.map((v,d)=>max[d]?v/max[d]:0);
}
function match(era,gender,answers){
 const pool=candidates(era,gender), profile=profileFor(era,answers);
 const ranked=pool.map(f=>({f,d:f.profile.reduce((n,v,i)=>n+(v-profile[i])**2,0)})).sort((a,b)=>a.d-b.d||a.f.id.localeCompare(b.f.id));
 const {profile:editorProfile,...figure}=ranked[0].f;
 const closest=dimensions.map((d,i)=>({...d,index:i,delta:Math.abs(profile[i]-editorProfile[i]),value:profile[i]})).sort((a,b)=>a.delta-b.delta).slice(0,3);
 return {figure,profile,dimensions,candidateCount:pool.length,
   reasons:closest.map(d=>({title:d.name,text:`在“${d.name}”相关选择中，你更接近${d.value>=0?d.high:d.low}的倾向，与本库为${figure.name}设定的文学化原型相近。`})),
   note:pool.length===1?'该朝代与性别范围内仅收录1位人物，因此人物结果固定；八维画像仍由你的26道回答生成。':'人物来自所选朝代与性别范围，按26题的综合倾向匹配；不代表心理学效度或历史人物真实性格。'};
}

return {eras,dimensions,banks,figures,candidates,publicQuestions,match};

 const voices={

  baijuyi:['你希望想法能够被真正听懂，而不只是显得高明。你常从日常的处境出发，让表达与具体的生活建立联系。','话说得明白，关心才更容易抵达。','愿意认真听的人，我也愿意认真讲。'],

  yuxuanji:['你不容易接受只有一种答案的生活。表达和选择都需要经过内心的认可，才会让你觉得自己确实在场。','我想说的话，不只为了合乎别人的期待。','一段生活值不值得，要问我自己的心。'],
  sushi:['你善于在境遇变化时，为生活重新找到可亲近的部分。你并非没有失落，而是愿意继续把日子过出一点滋味。','风雨来了，就把今天的路认真走完。','心里留一点余地，日子便还能长出新意。'],
  wanganshi:['你更容易从反复出现的问题里看见结构。你希望改变不只靠临时补救，而能形成一套经得起持续使用的办法。','总得有人把反复的难题往根上再问一问。','改变值得做，也值得把每一步做扎实。'],
  simaguang:['你在意一件事的前因后果，也愿意为弄清脉络投入长久的耐心。你希望决定建立在可以回看和查验的基础上。','先把来路理清，去路才不至于只凭猜想。','慢一点核对，是为了少一点无谓的反复。'],
  xinqiji:['你心里常有一个不愿轻易放下的方向。热情并不只出现在话语里，也会在反复受阻之后重新把你推向行动。','想做的事，我还愿意再认真试一次。','有些念头走过很多年，仍然值得拿出来说。'],
  yuefei:['你习惯把认定的事情落实在日常的纪律里。你相信可靠不是一时的激动，而是压力之下仍愿意继续完成。','把承诺守在每一天，才知道它有多重。','困难可以改变办法，不必先改变初心。'],
  shenkua:['你容易对习以为常的现象生出问题。你愿意观察、记录和尝试，让零散的经验逐渐成为能够说明的发现。','多看一眼，多试一次，也许就会发现不同。','我想知道的不只是是什么，还有为什么。'],
  liuyong:['你善于感受普通生活里的细微情绪，尤其是相聚与离别之间的余味。你希望表达能够贴近真实，而不只是体面。','人间的细小心事，也值得被认真唱出来。','说不尽的那一点，才让我愿意再停留。'],
  liqingzhao:['你对语言、细节和自己的感受都有一把清楚的尺。你愿意温柔地看世界，也不愿为了迁就而磨掉自己的判断。','细微之处，不必因为无人注意就将就。','我记得的，不只是事情，还有它落在心里的样子。'],
  liangshi:['你更愿意在需要协作的时刻直接接住责任。你在意的并非自己是否成为焦点，而是关键的位置有没有人守住。','有人在前面向前，我就把身后的事接稳。','需要我的时候，我会先把能做的做起来。'],
  liue:['你擅长把不同的要求放进一个可以持续运转的安排里。你重视掌握情况，也愿意为长远的稳定承受眼前的繁杂。','把每一处接续想清楚，局面才站得住。','从容不是事少，是心里知道轻重先后。'],
  caohou:['你重视克制与分寸，也能够理解稳定的支持有多大分量。你未必每次都站出来，却往往知道何时该把态度说清。','平日可以安静，重要的时候不能含糊。','我愿意照顾全局，也不会忘记心里的尺度。'],
  wangben:['你倾向于把明确的目标迅速转成可以执行的动作。任务越具体，你越容易集中精神，让大家看见切实的进展。','目标说清以后，就让事情一件件落下去。','做得到的安排，比响亮的保证更有用。'],
  zhanghan:['你对现实条件有敏锐的感知，不愿在局势改变后仍只守着原先的说法。你倾向于先找到还能稳住的一处，再调整下一步。','先看清手里还有什么，再决定下一步怎么走。','局面变了，办法也需要重新想过。'],
  mengyi:['你在复杂关系里仍希望保留清楚的尺度。对你而言，谨慎与担当可以同时存在，不必为了圆满场面就抹去判断。','把事情核清，也把自己的责任说清。','有些界限越是在复杂时越要记得。'],
  zhaogao:['你很容易察觉关系里的风向，也会留意一条信息会怎样改变局面。这种敏感可以帮助你理解环境，也需要避免被控制感牵着走。','先听见没有说出的部分，再决定怎么回应。','看清关系，也要记得关系之外的事实。'],
  huhai:['你对眼前的体验和即时反馈较为敏感，容易在明确的感受里找到行动动力。你需要的是让当下的兴致也能与较远的后果相处。','我想认真体验今天，也学着为明天留一点准备。','喜欢一件事的时候，更要记得问一句代价。'],
  ziying:['你能够在局面发生变化时重新衡量取舍。你不把坚持等同于不肯转身，更在意还有什么值得保全。','认清变化，不等于放弃自己的判断。','有时退开一步，是为了保住更重要的东西。'],
  wuguang:['你更容易从共同处境里产生行动的勇气。你不只关心自己能否向前，也希望身边的人愿意一起迈出那一步。','既然决定一起走，就把彼此的难处也算进去。','有人先起身，大家才会看见事情能够改变。'],
  xiangyu:['你对认定的目标和关系投入得很直接。你愿意在关键时刻承担决定，也需要为强烈的心意留出重新观察的空隙。','真正在意的事，我愿意用行动回答。','向前的时候，也给新的信息留一个位置。'],
  xiangliang:['你擅长把零散的力量组织成共同的行动。你会留意谁愿意同行，也知道开局时清楚的方向有多重要。','先把人和方向接起来，路才会慢慢出现。','我愿意先承担，让同行的人少一点犹豫。'],
  fanzeng:['你常比周围的人更早注意到局势里的隐患。你愿意提出长远判断，也容易因为别人没有及时理解而着急。','有些提醒，是因为已经看见了后面的路。','把判断说到别人能接住，也是谋划的一部分。'],
  liyou:['你重视自己的位置应当承担什么，不轻易因一时变化丢开正在做的事。你需要的是在守住职责时，也看见可调整的边界。','站在这里，就先把这里该做的做好。','守住责任，也要留心现实已经怎样改变。'],
  weiliao:['你更在意决定是否具备可行的条件，而非它听起来是否动人。你愿意看清资源、关系和代价，再选择自己的位置。','先问清条件，才知道承诺有没有分量。','进退之间，我希望保有清醒的选择。'],
  zhengguo:['你容易被那些可以长期改善生活的问题吸引。你愿意把宏大的愿望落到具体结构里，让改变成为能够持续发生的日常。','把一条路修通，很多人的日子就会不同。','慢工也可以有大用，只要方向值得。'],
  xiaohe:['你常能看见成果背后那些不显眼的接续工作。你愿意耐心统筹，让别人向前时知道身后有可以依靠的秩序。','把后面的事接稳，前面的人才走得踏实。','每一份清楚的记录，都是在为以后省力。'],
  chenping:['你擅长从僵住的关系中找到可以转动的一处。你不执着只有一种漂亮的解法，更关心怎样让现实真正出现转机。','换个角度看，未必还需要在原处用力。','留一点余地，事情才会有继续变化的可能。'],
  weiqing:['你愿意把力量放在能够照顾整体的地方。你重视行动，也记得行动之后，同行的人是否还能够跟得上。','把路走通，也把同行的人照看好。','稳稳做成的事，自会留下分量。'],
  dongzhongshu:['你习惯把零散的看法放回较完整的解释里。你希望自己的判断有根基，也愿意长期打磨其中的脉络。','先弄清根本，枝节才不会各说各话。','把一个问题想深，也要记得回到具体生活。'],
  suwu:['你能够把信念放进漫长而安静的日常里。你不一定需要旁人不断肯定，也愿意守住自己认可的那一部分。','没有人看见的时候，我也记得自己的选择。','时间可以很长，心里的尺度仍要自己保管。'],
  liuxiu:['你擅长在向前与等待之间找到合适的节奏。你既看重目标，也愿意把关系和条件一点点修整得更扎实。','能稳稳接住的机会，才值得真正向前。','把人心和准备放在一起，路会更长一些。'],
  zhangheng:['你会对普通现象背后的规律保持好奇。你愿意独自观察和反复尝试，也希望自己的发现能经得起实际检验。','习以为常的地方，也许藏着新的问题。','先认真看，再让一次次尝试接近答案。'],
  cailun:['你关心一种方法究竟能不能被更多人方便地使用。你愿意在材料、过程与结果之间反复试验，让改进变得具体。','好办法不只要想出来，还要用得起来。','把小处改好，日常就能轻一点。'],
  mayuan:['你不太愿意让眼前的限制替自己决定还有没有可能。只要目标仍值得，你就愿意重新准备，再向前走一段。','还愿意向前的时候，就把这一步踏实走好。','经历可以增加分量，不必只增加迟疑。'],
  douyifang:['你看重能够让生活长期安定的根本。面对外界不断变化的主张，你常会先回到自己经过检验的判断。','不必随着每一阵风，改变心里的根本。','把重要的守好，再谈别的取舍。'],
  sunce:['你常能用明确的行动点燃周围人的热情。你愿意开局，也享受把尚未成形的可能迅速推向现实的过程。','先让第一步发生，伙伴才看得见方向。','有些局面，是走进去之后才真正打开的。'],
  lvbu:['你对现场变化反应迅速，也珍惜个人行动的空间。你需要学习的不是磨掉锋芒，而是让这份力量有更稳定的落点。','能冲出去的时候，也要知道要守住什么。','锋芒可以属于我，承诺也应当属于我。'],
  simayi:['你愿意为看清局面等待，也能把很多判断留在尚未开口的时候。你重视长期的位置，不轻易被一时声势推着走。','不必每次都争在前面，但要知道自己在等什么。','看清变化，比急着证明判断更重要。'],
  xunyu:['你擅长把人的长处与事情的需要接在一起。你希望合作有成效，也愿意保留不因环境而轻易松动的原则。','把合适的人放对位置，事情就有了根基。','能一起做事很好，尺度也要一同守住。'],
  guojia:['你常能从繁杂的信息里抓住最会改变局势的一点。你愿意打破惯性，但也需要让直觉接受必要的核对。','与其处处用力，不如先看准真正的关节。','新的可能出现时，我愿意认真看一眼。'],
  lusu:['你能够看见单独一方之外的共同利益。你愿意耐心解释和建立信任，让彼此并不完全相同的人仍能一起前行。','先找到能共同承担的事，信任才有落点。','把话说到彼此听得懂，也是在推动大局。'],
  luxun:['你不急于被外界的催促带动，愿意等待信息与条件逐渐清楚。你相信沉着并非被动，而是把力量用在更合适的时候。','等一等，不是没有主张，是在等条件说话。','看清局面之后，行动可以很干净。'],
  zhangliao:['你在明确的压力下往往更容易集中。你擅长抓住关键的一步，也愿意通过紧凑的行动给周围的人建立信心。','要紧的时候，先把最关键的一步做出来。','分工清楚，行动就不必被杂音拖住。'],
  zhangfei:['你愿意把喜欢、认可和不赞同说得直接。你的热心通常不难被看见，也需要给别人不同的节奏留一点缓冲。','在意的人和事，我不想只放在心里。','话可以直，回应别人的时候也可以慢一点。'],
  bufuren:['你容易察觉关系里哪一处需要照顾，又不急着把照顾变成自己的表现。你重视让相处变得安稳而可持续。','让人安心的回应，也有很长久的力量。','我愿意照看别人，也会慢慢说出自己的需要。'],
  direnjie:['你愿意从细节里辨认事情真正的轮廓，也记得事实背后有具体的人。你的判断希望既站得住，也能解决问题。','先把事情问清，再让判断落得公允。','说理不只是为了赢，也是为了少一些误解。'],
  hanyu:['你对自己认定的道理有强烈的表达欲。你愿意把想法讲透，也希望自己的投入能为后来者留下一条更清楚的路。','既然认定值得说，就把依据也说扎实。','我想留下的，不只是一时响亮的声音。'],
  liuzongyuan:['你愿意在不顺的境遇里继续观察现实。你不喜欢轻易接受现成解释，更习惯把问题带回自己的思考与体验。','失意的时候，也不妨碍把世界看得清楚。','我仍愿意追问，因为事情未必只有一个说法。'],
  liuyuxi:['你能够在反复变化中保有自己的精神。你不一定处处针锋相对，却愿意用清楚的表达回应那些不想妥协的部分。','日子可以转弯，精神不必跟着折下去。','把经历重新写过，也是在重新理解自己。'],
  zhangjiuling:['你重视判断里的清明，也在意表达时的分寸。你愿意把长远的隐忧说出来，即使它暂时不够合乎众人的期待。','眼前的圆满，不该遮住远处的问题。','提醒可以温和，判断仍要清楚。'],
  yanzhenqing:['你愿意把原则落实到可以看见的日常功夫里。你不急着追求每一次新鲜，更在意自己是否站得正、做得实。','一笔一画有来处，一言一行也要有分量。','先把自己站稳，再去面对外面的风。'],
  sunsimiao:['你容易把注意力放到具体的人和细小的需要上。你相信认真观察与耐心照看可以并行，不必用匆忙代替关怀。','愿意多问一句，便可能少忽略一种难处。','关心落在细处，才真正接近一个人。'],

  fanzhongyan:['你容易把个人选择放到更广的处境里考虑。你愿意承担较长远的责任，也需要记得自己的心力同样值得照看。','眼前的事认真做，远处的人也放在心上。','承担不是永远不累，而是知道为何还愿意。'],
  baozheng:['你更信任可以核验的事实与明确的边界。你愿意把难以回避的问题讲清，也在意同一把尺是否能公平地落下。','把事情核清，再把判断说得明白。','尺度不该因为人不同，就悄悄换了位置。'],
  suzhe:['你愿意在开口之前多想一层，在行动之前多留一分余地。你的支持常常不喧哗，却能在长久相处里显出可靠。','我不急着说满，也不轻易把承诺收回。','把事情想得稳一点，同行的人就安心一点。'],
  luyou:['你能够把长久的心意藏进日常的细小坚持里。你珍惜寻常生活，也不愿因此忘记那些一直没有放下的方向。','把今天认真过好，也不把长久的愿望忘掉。','初心不必天天高声，却可以日日有回应。'],
  wentianxiang:['你重视自己的选择是否经得起内心的追问。你愿意在困难时保有明确的立场，也知道担当需要付出具体的代价。','我希望回头时，仍能认得自己作出的选择。','重要的不是说过什么，而是最后怎样做。'],
  zhuxi:['你喜欢把问题往根本上理清，也愿意用很长的时间反复辨析。你希望所学不只停留在记忆里，还能成为理解事物的秩序。','弄清一个根本，很多细节才有安放的地方。','把学到的放回生活，才知道是否真正明白。'],
  songci:['你愿意在别人已经准备下结论时，再核对一次细节。你相信耐心和证据有时能够替不善表达的人争取公允。','多核对一处，也许就能少一点轻率的判断。','不能只听一个说法，还要让事实自己出现。'],
  zhushuzhen:['你对心意是否真实有很高的要求，也愿意珍惜那些不容易被他人理解的细微感受。你希望自己的声音保持自己的颜色。','细小的心事，也有被认真对待的理由。','我愿意温柔地表达，也愿意保有自己的选择。']

<script>// 按内容测量并生成完整长图，所有分区共用网页报告的数据。
function drawFullReport(report){
 const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1;
 const measure=canvas.getContext('2d');if(!measure)throw new Error('当前环境暂不支持生成结果长图');
 const commands=[],font='"Microsoft YaHei","PingFang SC",sans-serif';let cursor=54;
 function textLines(text,size,width,weight='normal'){
  measure.font=`${weight} ${size}px ${font}`;const lines=[];let line='';
  for(const char of String(text)){if(char==='\n'){lines.push(line);line='';continue;}if(line&&measure.measureText(line+char).width>width){lines.push(line);line=char;}else line+=char;}if(line)lines.push(line);return lines;
 }
 function panel(title,blocks,kind='body'){
  const top=cursor,draw=[],left=96,width=888;let y=top+44;
  function text(text,size=29,color='#302653',weight='normal',gap=14){const lines=textLines(text,size,width,weight),lh=Math.ceil(size*1.65);for(const line of lines){const baseline=y+size;draw.push(ctx=>{ctx.font=`${weight} ${size}px ${font}`;ctx.textAlign='left';ctx.fillStyle=color;ctx.fillText(line,left,baseline);});y+=lh;}y+=gap;}
  if(title)text(title,32,'#302653','bold',24);
  if(kind==='cover'){
   text('与你遥相呼应的人',30,'#7864bd','normal',20);
   text(report.figure.name,report.figure.name.length>7?60:80,'#302653','bold',12);
   text(`${report.eraName} · ${report.figure.role}`,27,'#9187a9','normal',18);
   text(report.figure.tags.join('  ·  '),27,'#7864bd','normal',14);
   text(`主导维度：${report.dominant.name} · ${report.dominant.side}`,26,'#7864bd','normal',20);
   text('人物心声',26,'#7864bd','bold',6);text('“'+report.voice+'”',29);
  }else if(kind==='metrics'){
   text('数值为答题倾向指数，不代表能力高低或测评准确率。',24,'#9187a9','normal',22);
   for(const m of report.metrics){const baseline=y+27,barY=y+12;
    draw.push(ctx=>{ctx.textAlign='left';ctx.font=`27px ${font}`;ctx.fillStyle='#302653';ctx.fillText(m.name,left,baseline);ctx.fillStyle='#eee9f7';ctx.beginPath();ctx.roundRect(245,barY,650,14,7);ctx.fill();ctx.fillStyle='#7864bd';if(m.value>0){ctx.beginPath();ctx.roundRect(245,barY,650*m.value/100,14,7);ctx.fill();}ctx.textAlign='right';ctx.font=`26px ${font}`;ctx.fillText(String(m.value),984,baseline);});
    y+=60;
   }
  }else{
   for(const block of blocks){if(block.title)text(block.title,27,'#514273','bold',6);text(block.text,29,block.muted?'#9187a9':'#403556','normal',24);}
  }
  const height=y-top+18;
  commands.push(ctx=>{ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(54,top,972,height,30);ctx.fill();});commands.push(...draw);cursor=top+height+26;
 }
 panel('',[],'cover');
 panel('01 · 人物自画像',[{text:report.portrait},{title:'历史中的'+report.figure.name,text:report.figure.history,muted:true}]);
 panel('02 · 八维能力结构',[],'metrics');
 panel('03 · 你与TA的共同底色',report.common);
 panel('04 · 现实中的你',report.reality);
 panel('05 · 性格盲点与风险提醒',report.risks);
 panel('06 · 你的三句人物台词',report.lines.map(line=>({text:'“'+line+'”'})).concat([{text:'人物心声与台词为测试原创代入表达，并非历史人物原话。',muted:true}]));
 panel('灵魂照面 · 趣味性自我探索',[{text:report.note,muted:true},...(report.rangeNotice?[{text:report.rangeNotice,muted:true}]:[])]);
 canvas.height=Math.ceil(cursor+28);const ctx=canvas.getContext('2d');ctx.fillStyle='#efebf8';ctx.fillRect(0,0,1080,canvas.height);for(const draw of commands)draw(ctx);

}

 function genderPage(){
  const era=config.eras.find(e=>e.id===state.eraChoice);
  render(`<section class="paper selection gender"><h1 tabindex="-1">你希望遇见谁？</h1><p class="subtext">${era?`${esc(era.name)} · ${esc(era.period)}`:'随机朝代 · 开始时随机抽取一个朝代'}<br>选择希望匹配的历史人物性别。</p><div class="choice-list">${[['male','男','男性人物','只匹配男性历史人物'],['female','女','女性人物','只匹配女性历史人物'],['any','不限','不限性别','由你的性格倾向自由匹配']].map(([id,glyph,label,description])=>`<button class="choice" data-gender="${id}"><span class="glyph" aria-hidden="true">${glyph}</span><span class="choice-copy"><strong>${label}</strong><small>${description}</small></span>${chevron}</button>`).join('')}</div>${era?.id==='qin'?'<p class="candidate-note"><strong>秦朝女性方向说明</strong><br>为保证史料可靠，此方向固定对应巴寡妇清。若希望获得不同的人物结果，可选择“不限性别”或更换朝代。</p>':''}<p class="footnote">这里只筛选人物范围，不是询问你的生理性别，<br>也不会改变题目内容与计分方式。${era?`<br>${esc(era.note)}`:'<br>秦朝女性方向固定对应巴寡妇清；其余按抽中的朝代匹配。'}</p><p id="start-error" class="error" role="alert"></p></section>`,'gender');
  main.querySelectorAll('[data-gender]').forEach(button=>button.addEventListener('click',()=>start(button.dataset.gender)));
 }
 async function start(gender){
  if(busy)return;busy=true;main.querySelectorAll('button').forEach(b=>b.disabled=true);
  try{const data=createTest(state.eraChoice,gender);state={version:3,eraChoice:state.eraChoice,era:data.era,gender,answers:Array(26).fill(null),index:0,complete:false};questions=data.questions;result=null;currentReport=null;save();question();if(data.candidateCount===1)notify('当前人物方向固定对应巴寡妇清，详细解读仍由你的回答生成。');}
  catch(e){$('start-error').textContent=e.message;main.querySelectorAll('button').forEach(b=>b.disabled=false);busy=false;}
 }
 async function resume(){
  if(busy)return;busy=true;const button=$('resume');if(button)button.disabled=true;
  try{const data=createTest(state.era,state.gender);questions=data.questions;if(state.complete||state.answers.every(validAnswer))await finish();else question();}
  catch(e){{busy=false;if(button)button.disabled=false;notify(e.message);}}
 }
 function question(){
  const q=questions[state.index];if(!q){eraPage();return;}const answered=state.answers.filter(validAnswer).length;
  render(`<section class="paper progress-card" aria-label="答题进度"><div class="progress-label"><span>${esc(q.ability)}</span><span class="progress-count">${state.index+1} / 26 · 已答${answered}题</span></div><div class="progress-track" role="progressbar" aria-label="已完成题目" aria-valuemin="0" aria-valuemax="26" aria-valuenow="${answered}"><div class="progress-fill" style="width:${answered/26*100}%"></div></div></section><section class="paper question"><div class="ability-label">本题考察：${esc(q.ability)}</div><p class="ability-hint">${esc(q.hint)}</p><p class="context">${esc(q.type)}</p><h1 id="question-title" tabindex="-1">${esc(q.title)}</h1><div class="answers" role="group" aria-labelledby="question-title">${q.options.map((o,i)=>`<button class="answer" data-answer="${i}" aria-pressed="${state.answers[state.index]===i}"><span class="answer-letter" aria-hidden="true">${'ABCD'[i]}</span><span>${esc(o.text)}</span></button>`).join('')}</div><div class="question-nav"><button id="previous" class="secondary">${state.index?'上一题':'返回设置'}</button><span id="auto-note" class="auto-note">${state.index===25?'选择后生成人物档案':'选择后自动进入下一题'}</span></div><details><summary>关于这道题</summary><p>${esc(q.note)}</p><p>时代背景与延伸阅读：<a href="${esc(q.source.url)}" rel="noreferrer">${esc(q.source.title)}</a></p></details></section>`,'quiz');
  main.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.answer))));
  $('previous').addEventListener('click',back);
 }
 function choose(answer){
  if(busy||!validAnswer(answer))return;busy=true;state.answers[state.index]=answer;state.complete=false;save();
  main.querySelectorAll('[data-answer]').forEach(b=>{b.setAttribute('aria-pressed',String(Number(b.dataset.answer)===answer));b.disabled=true;});
  const count=state.answers.filter(validAnswer).length;main.querySelector('.progress-fill').style.width=count/26*100+'%';main.querySelector('[role=progressbar]').setAttribute('aria-valuenow',count);
  $('auto-note').textContent=state.index===25?'正在生成人物档案…':'已选择，即将进入下一题…';
  advanceTimer=setTimeout(async()=>{if(state.index<25){state.index++;save();question();}else await finish();},window.matchMedia('(prefers-reduced-motion: reduce)').matches?120:380);
 }
 async function finish(){
  try{result=OfflineQuiz.match(state.era,state.gender,state.answers);state.complete=true;save();resultPage();}
  catch(e){{question();notify(e.message+' 可再次选择最后一题重试。');}}
 }
 function resultPage(){
  const r=currentReport=ReportBuilder.create(result),f=r.figure;r.eraName=eraName(f.era);
  const cards=items=>items.map(item=>`<div class="report-card"><h3>${esc(item.title)}</h3><p>${esc(item.text)}</p></div>`).join('');
  render(`<article class="result-report"><header class="paper result-cover"><p class="result-kicker">与你遥相呼应的人</p><h1 class="result-name" tabindex="-1">${esc(f.name)}</h1><p class="result-role">${eraName(f.era)} · ${esc(f.role)}</p><div class="tags">${f.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><p class="dominant-label">主导维度：${esc(r.dominant.name)} · ${esc(r.dominant.side)}</p><div class="character-voice"><strong>人物心声</strong><p>“${esc(r.voice)}”</p></div></header><section class="paper report-block" data-report-section="portrait"><h2>01 · 人物自画像</h2><p>${esc(r.portrait)}</p><details class="history-detail"><summary>历史中的${esc(f.name)}</summary><p>${esc(f.history)}</p><a class="source-link" href="${esc(f.source)}" rel="noreferrer">史料与延伸阅读</a></details></section><section class="paper report-block" data-report-section="metrics"><h2>02 · 八维能力结构</h2><p class="report-caption">数值是本次答题的倾向指数，不代表能力高低或测评准确率。</p><div class="metric-list">${r.metrics.map(m=>`<div class="metric-row"><span>${esc(m.name)}</span><div class="metric-track" role="meter" aria-label="${esc(m.fullName)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${m.value}" aria-valuetext="${esc(m.side)}，倾向指数${m.value}"><span style="width:${m.value}%"></span></div><b>${m.value}</b></div>`).join('')}</div></section><section class="paper report-block" data-report-section="common"><h2>03 · 你与TA的共同底色</h2><div class="report-grid">${cards(r.common)}</div></section><section class="paper report-block" data-report-section="reality"><h2>04 · 现实中的你</h2><div class="reality-list">${cards(r.reality)}</div></section><section class="paper report-block" data-report-section="risks"><h2>05 · 性格盲点与风险提醒</h2><div class="report-grid">${cards(r.risks)}</div></section><section class="paper report-block" data-report-section="lines"><h2>06 · 你的三句人物台词</h2><div class="report-grid quote-grid">${r.lines.map(line=>`<blockquote class="report-card">“${esc(line)}”</blockquote>`).join('')}</div><p class="report-caption">人物心声与台词均为本测试原创代入文案，并非历史人物原话。</p></section><p class="report-disclaimer">${esc(r.note)}${r.rangeNotice?`<br>${esc(r.rangeNotice)}`:''}</p><div class="result-actions"><button class="primary" id="share">保存完整结果</button><button class="secondary" id="restart">再测一次</button></div><button class="text-button review-button" id="review">回看并修改答案</button></article>`,'result',`我遇见了${f.name}`);
  $('share').addEventListener('click',share);$('restart').addEventListener('click',eraPage);$('review').addEventListener('click',()=>{state.index=0;question();});
 }
 function back(){clearTimeout(advanceTimer);busy=false;if(screen==='gender')eraPage();else if(screen==='quiz'){if(state.index){state.index--;save();question();}else genderPage();}else if(screen==='result')eraPage();}
 $('back').addEventListener('click',back);
 function wrap(ctx,text,x,y,width,lineHeight){let line='';for(const char of text){if(ctx.measureText(line+char).width>width){ctx.fillText(line,x,y);y+=lineHeight;line=char;}else line+=char;}if(line)ctx.fillText(line,x,y);return y+lineHeight;}
 async function share(){
  const button=$('share');button.disabled=true;button.textContent='正在制作…';
  try{await document.fonts?.ready;const canvas=drawFullReport(currentReport);
   $('share-image').src=canvas.toDataURL('image/png');$('download').href=$('share-image').src;
   $('download').download=`${currentReport.figure.name}-灵魂照面完整报告.png`;
   shareFocus=document.activeElement;$('share-overlay').hidden=false;document.body.style.overflow='hidden';$('close-share').focus();
  }catch(e){notify(e.message||'图片生成失败，请稍后重试。');}finally{button.disabled=false;button.textContent='保存完整结果';}
 }
 function closeShare(){$('share-overlay').hidden=true;document.body.style.overflow='';shareFocus?.focus();}
 $('close-share').addEventListener('click',closeShare);$('share-overlay').addEventListener('click',e=>{if(e.target===$('share-overlay'))closeShare();});
 document.addEventListener('keydown',e=>{if($('share-overlay').hidden)return;if(e.key==='Escape')closeShare();if(e.key==='Tab'){const focusables=[$('close-share'),$('download')],first=focusables[0],last=focusables[1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
 function boot(){
  config={eras:OfflineQuiz.eras,dimensions:OfflineQuiz.dimensions};
  restore();eraPage();
 }
 boot();
})();
</script>
</body>
</html>
